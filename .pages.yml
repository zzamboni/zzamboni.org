media:
  input: static/img
  output: /img
  rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "auto: pagescms create: {path}"
      update: "auto: pagescms update: {path}"
      delete: "auto: pagescms delete: {path}"
      rename: "auto: pagescms rename: {oldPath} -> {newPath}"

content:
  - name: posts
    label: Blog posts
    type: collection
    path: content-pagescms
    format: toml-frontmatter
    subfolders: false

    filename: "{year}-{month}-{day}-{primary}.md"

    view:
      primary: title
      fields: [title, date, draft]
      sort: [date, title]
      search: [title, summary, tags]
      default:
        sort: date
        order: desc

    operations:
      rename: false
      delete: true

    actions:
      - name: generate-image
        label: Generate image
        scope: entry
        workflow: generate-feature-image.yml
        ref: current
        confirm:
          title: Generate a feature image?
          message: Uses the saved post and opens a pull request to review the image.
          button: Generate image
        fields:
          - name: extra_prompt
            label: Additional artistic direction
            type: textarea
          - name: force
            label: Replace an existing feature image
            type: checkbox
            default: false

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: externalUrl
        label: External link
        type: string

      - name: summary
        label: Summary
        type: text
        options:
          maxlength: 400

      - name: body
        label: Body
        type: rich-text
        
      - name: date
        label: Date
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss.SSS"

      - name: tags
        label: Tags
        type: string
        list: true

      - name: draft
        label: Draft
        type: boolean
        default: true

      - name: featureimage
        label: Feature image
        type: string
        default: "img/tram-zurich.jpg"
        hidden: false

      - name: toc
        label: Table of contents
        type: boolean
        default: false

  - name: legacy
    label: Legacy posts (Markdown)
    type: collection
    path: content-legacy
    format: yaml-frontmatter
    subfolders: false
    filename: "{primary}.md"

    view:
      primary: title
      fields: [title, date, draft]
      sort: [date, title]
      search: [title, summary, description, tags]
      default:
        sort: date
        order: desc

    operations:
      create: false
      rename: false
      delete: true

    actions:
      - name: generate-image
        label: Generate image
        scope: entry
        workflow: generate-feature-image.yml
        ref: current
        confirm:
          title: Generate a feature image?
          message: Uses the saved post and opens a pull request to review the image.
          button: Generate image
        fields:
          - name: extra_prompt
            label: Additional artistic direction
            type: textarea
          - name: force
            label: Replace an existing feature image
            type: checkbox
            default: false

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        description: Preserve the existing date or ISO timestamp, including its timezone when present.
        type: string

      - name: draft
        label: Draft
        type: boolean

      - name: tags
        label: Tags
        type: string
        list: true

      - name: summary
        label: Summary
        type: text

      - name: description
        label: Legacy description
        type: text

      - name: featureimage
        label: Feature image
        type: string

      - name: slug
        label: URL slug
        type: string
        readonly: true

      - name: body
        label: Body (Markdown or HTML)
        description: Preserve existing HTML, shortcodes, and Markdown when editing.
        type: code
        options:
          format: markdown

  - name: legacy-html
    label: Legacy posts (HTML)
    type: collection
    path: content-legacy
    format: yaml-frontmatter
    subfolders: false
    filename: "{primary}.html"

    view:
      primary: title
      fields: [title, date, draft]
      sort: [date, title]
      search: [title, summary, description, tags]
      default:
        sort: date
        order: desc

    operations:
      create: false
      rename: false
      delete: true

    actions:
      - name: generate-image
        label: Generate image
        scope: entry
        workflow: generate-feature-image.yml
        ref: current
        confirm:
          title: Generate a feature image?
          message: Uses the saved post and opens a pull request to review the image.
          button: Generate image
        fields:
          - name: extra_prompt
            label: Additional artistic direction
            type: textarea
          - name: force
            label: Replace an existing feature image
            type: checkbox
            default: false

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        description: Preserve the existing date or ISO timestamp, including its timezone when present.
        type: string

      - name: draft
        label: Draft
        type: boolean

      - name: tags
        label: Tags
        type: string
        list: true

      - name: summary
        label: Summary
        type: text

      - name: description
        label: Legacy description
        type: text

      - name: featureimage
        label: Feature image
        type: string

      - name: slug
        label: URL slug
        type: string
        readonly: true

      - name: body
        label: Body (HTML)
        description: Preserve existing HTML, shortcodes, and Markdown when editing.
        type: code
        options:
          format: html

  - name: photos
    label: Photos
    type: collection
    path: content-photos
    format: toml-frontmatter
    subfolders: true

    view:
      layout: tree
      node:
        filename: index.md
        hideDirs: all
      primary: title
      fields: [title, date, draft]
      sort: [date, title]
      search: [title, summary, tags]

    operations:
      rename: false
      delete: true

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: summary
        label: Summary
        type: text

      - name: photos
        label: Photos
        type: image
        options:
          multiple:
            max: 20
          unique: true
          rename: true
          extensions: [jpg, png, webp]

      - name: showHero
        label: Full-page photo background
        type: boolean
        default: false

      - name: body
        label: Commentary
        description: Commentary is displayed above the photo gallery.
        type: rich-text

      - name: date
        label: Date
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss.SSS"

      - name: tags
        label: Tags
        type: string
        list: true
        default: [ "photos" ]

      - name: draft
        label: Draft
        type: boolean
        default: true
