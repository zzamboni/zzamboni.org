media:
  input: static/img
  output: /img
  rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "auto: pagescms create: {filename}"
      update: "auto: pagescms update: {filename}"
      delete: "auto: pagescms delete: {filename}"
      rename: "auto: pagescms rename: {oldFilename} -> {newFilename}"

content:
  - name: posts
    label: Blog posts
    type: collection
    path: content-pagescms
    format: toml-frontmatter
    subfolders: false

    filename: "{year}-{month}-{day}-{primary}.md"

    view:
      primary: title
      fields: [title, date, draft]
      sort: [date, title]
      search: [title, summary, tags]
      default:
        sort: date
        order: desc

    operations:
      rename: false
      delete: true

    actions:
      - name: generate-image
        label: Generate image
        scope: entry
        workflow: generate-feature-image.yml
        ref: current
        confirm:
          title: Generate a feature image?
          message: Uses the saved post and opens a pull request to review the image.
          button: Generate image
        fields:
          - name: extra_prompt
            label: Additional artistic direction
            type: textarea
          - name: force
            label: Replace an existing feature image
            type: checkbox
            default: false

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: externalUrl
        label: External link
        type: string

      - name: summary
        label: Summary
        type: text
        options:
          maxlength: 400

      - name: body
        label: Body
        type: rich-text
        
      - name: date
        label: Date
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss.SSS"

      - name: tags
        label: Tags
        type: string
        list: true

      - name: draft
        label: Draft
        type: boolean
        default: true

      - name: featureimage
        label: Feature image
        type: string
        default: "img/tram-zurich.jpg"
        hidden: false

      - name: toc
        label: Table of contents
        type: boolean
        default: false
