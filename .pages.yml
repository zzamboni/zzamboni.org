media:
  input: static/img
  output: /img
  rename: safe

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "auto: pagescms create: {path}"
      update: "auto: pagescms update: {path}"
      delete: "auto: pagescms delete: {path}"
      rename: "auto: pagescms rename: {oldPath} -> {newPath}"

# Shared field definitions; collection-specific settings override these components.
components:
  title:
    label: Title
    type: string
  summary:
    label: Summary
    type: text
  tags:
    label: Tags
    type: string
    list: true
  draft:
    label: Draft
    type: boolean
  featureimage:
    label: Feature image
    type: string
  zurich_date:
    label: Date
    type: date
    required: true
    options:
      time: true
      format: "yyyy-MM-dd'T'HH:mm:ss.SSS"
  legacy_date:
    label: Date
    description: Preserve the existing date or ISO timestamp, including its timezone when present.
    type: string
  legacy_description:
    label: Legacy description
    type: text
  slug:
    label: URL slug
    type: string
    readonly: true

content:
  - name: posts
    label: Blog posts
    type: collection
    path: content-pagescms
    format: toml-frontmatter
    subfolders: false

    filename: "{year}-{month}-{day}-{primary}.md"

    view:
      primary: title
      fields: &post_list_fields [title, date, draft]
      sort: &post_sort_fields [date, title]
      search: &post_search_fields [title, summary, tags]
      default: &newest_first
        sort: date
        order: desc

    operations:
      rename: false
      delete: true

    actions:
      - name: generate-summary
        label: Generate summary
        scope: entry
        workflow: generate-pagescms-summary.yml
        ref: current
        confirm:
          title: Generate a missing summary?
          message: Uses the saved post or linked article and commits a summary if the summary field is blank. Save your changes first.
          button: Generate summary
      - &generate_image
        name: generate-image
        label: Generate image
        scope: entry
        workflow: generate-feature-image.yml
        ref: current
        confirm:
          title: Generate a feature image?
          message: Uses the saved post and opens a pull request to review the image.
          button: Generate image
        fields:
          - name: style
            label: Image style
            type: select
            required: true
            default: "Photographic editorial image"
            options:
              - label: "Photographic editorial image"
                value: "Photographic editorial image"
              - label: "Analog film photography"
                value: "Analog film photography"
              - label: "Architectural photography"
                value: "Architectural photography"
              - label: "Macro photography"
                value: "Macro photography"
              - label: "Printmaking / linocut"
                value: "Printmaking / linocut"
              - label: "Editorial illustration"
                value: "Editorial illustration"
          - name: extra_prompt
            label: Additional artistic direction
            type: textarea
          - name: force
            label: Replace an existing feature image
            type: checkbox
            default: false

    fields:
      - name: title
        component: title
        required: true

      - name: externalUrl
        label: External link
        type: string

      - name: summary
        component: summary
        options:
          maxlength: 400

      - name: body
        label: Body
        type: rich-text
        
      - name: date
        component: zurich_date

      - name: tags
        component: tags

      - name: draft
        component: draft
        default: true

      - name: featureimage
        component: featureimage
        default: "img/tram-zurich.jpg"
        hidden: false

      - name: toc
        label: Table of contents
        type: boolean
        default: false

  - name: photos
    label: Photos
    type: collection
    path: content-photos
    format: toml-frontmatter
    subfolders: true

    view:
      layout: tree
      node: &bundle_node
        filename: index.md
        hideDirs: all
      primary: title
      fields: *post_list_fields
      sort: *post_sort_fields
      search: *post_search_fields

    operations:
      rename: false
      delete: true

    fields:
      - name: title
        component: title
        required: true

      - name: summary
        component: summary

      - name: photos
        label: Photos
        type: image
        options:
          multiple:
            max: 20
          unique: true
          rename: true
          extensions: [jpg, png, webp]

      - name: showHero
        label: Full-page photo background
        type: boolean
        default: false

      - name: body
        label: Commentary
        description: Commentary is displayed above the photo gallery.
        type: rich-text

      - name: date
        component: zurich_date

      - name: tags
        component: tags
        default: [ "photos" ]

      - name: draft
        component: draft
        default: true

  - name: org-posts
    label: Org posts (image actions)
    type: collection
    path: content/post
    format: toml-frontmatter
    subfolders: true
    exclude: ["_index.md", "*.markdown"]

    view:
      layout: tree
      node: *bundle_node
      primary: title
      fields: *post_list_fields
      sort: *post_sort_fields
      search: *post_search_fields
      default: *newest_first

    operations:
      create: false
      rename: false
      delete: false

    actions:
      - *generate_image

    fields:
      - name: title
        component: title
        label: Title (edit in Org)
        readonly: true
      - name: date
        label: Date (edit in Org)
        type: string
        readonly: true
      - name: draft
        component: draft
        label: Draft (edit in Org)
        readonly: true
      - name: summary
        component: summary
        label: Summary (edit in Org)
        readonly: true
      - name: tags
        component: tags
        label: Tags (edit in Org)
        readonly: true
      - name: featureimage
        component: featureimage
        label: Feature image (generated by action)
        readonly: true
      - name: body
        label: Body (edit in Org)
        type: code
        readonly: true
        options:
          format: markdown

  - name: legacy
    label: Legacy posts (Markdown)
    type: collection
    path: content-legacy
    format: yaml-frontmatter
    subfolders: false
    filename: "{primary}.md"

    view: &legacy_view
      primary: title
      fields: *post_list_fields
      sort: *post_sort_fields
      search: [title, summary, description, tags]
      default: *newest_first

    operations:
      create: false
      rename: false
      delete: true

    actions:
      - *generate_image

    fields:
      - name: title
        component: title
        required: true

      - name: date
        component: legacy_date

      - name: draft
        component: draft

      - name: tags
        component: tags

      - name: summary
        component: summary

      - name: description
        component: legacy_description

      - name: featureimage
        component: featureimage

      - name: slug
        component: slug

      - name: body
        label: Body (Markdown or HTML)
        description: Preserve existing HTML, shortcodes, and Markdown when editing.
        type: code
        options:
          format: markdown

  - name: legacy-html
    label: Legacy posts (HTML)
    type: collection
    path: content-legacy
    format: yaml-frontmatter
    subfolders: false
    filename: "{primary}.html"

    view: *legacy_view

    operations:
      create: false
      rename: false
      delete: true

    actions:
      - *generate_image

    fields:
      - name: title
        component: title
        required: true

      - name: date
        component: legacy_date

      - name: draft
        component: draft

      - name: tags
        component: tags

      - name: summary
        component: summary

      - name: description
        component: legacy_description

      - name: featureimage
        component: featureimage

      - name: slug
        component: slug

      - name: body
        label: Body (HTML)
        description: Preserve existing HTML, shortcodes, and Markdown when editing.
        type: code
        options:
          format: html
