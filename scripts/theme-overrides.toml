# Matching paths under layouts/ are detected automatically. List indirect
# dependencies here so changes to their upstream templates also get reviewed.
[[overrides]]
local = "layouts/tags/terms.html"
upstream = "layouts/_default/terms.html"
reason = "Only Tags replaces the default taxonomy text list with a tag cloud; other taxonomies use the theme template."

[[overrides]]
local = "layouts/partials/shortcode-admonition.html"
upstream = "layouts/_default/_markup/render-blockquote.html"
reason = "Legacy tip, note, and warning shortcodes render Markdown alerts through Blowfish's admonition hook."

[[overrides]]
local = "assets/css/custom.css"
upstream = "layouts/partials/header/floating.html"
reason = "Offset the fixed floating header below the measured deployment banner, preserving its responsive top gutters."

[[overrides]]
local = "assets/js/medium-zoom.js"
upstream = "assets/js/medium-zoom.js"
reason = "Retain the zoom instance so standalone article figures can transfer to GLightbox without duplicate listeners."

[[overrides]]
local = "layouts/partials/related.html"
upstream = "layouts/partials/article-link/card-related.html"
reason = "Article-only related content reuses Blowfish's related-card renderer."

[[overrides]]
local = "layouts/partials/home/custom.html"
upstream = "layouts/partials/home/background.html"
reason = "Site title and page content replace the theme author profile."

[[overrides]]
local = "layouts/partials/extend-single-header.html"
upstream = "layouts/_default/single.html"
reason = "Local single.html calls the external-link header hook."

[[overrides]]
local = "layouts/partials/extend-article-link.html"
upstream = "layouts/partials/article-link/simple.html"
reason = "Listing hook adds external-link badges and tags."

[[overrides]]
local = "layouts/partials/comments.html"
upstream = "layouts/partials/article-comments.html"
reason = "Keep the site's Disqus partial working through the comment wrapper."

[[overrides]]
local = "layouts/partials/home/feeds.html"
upstream = "layouts/partials/article-link/simple.html"
reason = "Homepage post feed reuses the summary and linkblog markup; sidebar renders photo thumbnails."
