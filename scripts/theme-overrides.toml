# Matching paths under layouts/ are detected automatically. List indirect
# dependencies here so changes to their upstream templates also get reviewed.
[[overrides]]
local = "layouts/partials/related.html"
upstream = "layouts/partials/article-link/card-related.html"
reason = "Article-only related content reuses Blowfish's related-card renderer."

[[overrides]]
local = "layouts/partials/home/custom.html"
upstream = "layouts/partials/home/custom.html"
reason = "Commonplace homepage hook replaces the theme author profile with the editorial hero and existing feeds."

[[overrides]]
local = "layouts/partials/extend-single-header.html"
upstream = "layouts/_default/single.html"
reason = "Local single.html calls the external-link header hook."

[[overrides]]
local = "layouts/partials/extend-article-link.html"
upstream = "layouts/partials/article-link/simple.html"
reason = "Listing hook adds external-link badges and tags."

[[overrides]]
local = "layouts/partials/comments.html"
upstream = "layouts/partials/article-comments.html"
reason = "Keep the site's Disqus partial working through the comment wrapper."

[[overrides]]
local = "layouts/partials/home/feeds.html"
upstream = "layouts/partials/article-link/simple.html"
reason = "Homepage feed uses Commonplace editorial rows in place of Blowfish simple rows; sidebar preserves photo selection and sizing."

[[overrides]]
local = "themes/commonplace/layouts/partials/header/basic.html"
upstream = "layouts/partials/header/basic.html"
reason = "Editorial masthead retains upstream desktop/mobile components and JS IDs."

[[overrides]]
local = "themes/commonplace/layouts/partials/article-link/simple.html"
upstream = "layouts/partials/article-link/simple.html"
reason = "Date-led editorial rows replace thumbnail lists, retain the linkblog hook and expose local plus external links."

[[overrides]]
local = "themes/commonplace/assets/css/commonplace.css"
upstream = "layouts/_default/single.html"
reason = "Reader and TOC styles depend on the retained single-page structure."
