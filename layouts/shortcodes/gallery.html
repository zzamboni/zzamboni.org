{{ $id := delimit (slice "gallery" (partial "functions/uid.html" .)) "-" -}}
{{ $content := .Inner -}}
{{ $figureClass := .Get "figureClass" | default "grid-w33" -}}
{{/* Preserve figure-level classes; use the gallery class only when missing. */}}
{{ $content = replaceRE `<figure>` (printf `<figure class="%s">` $figureClass) $content -}}

{{/* find all img tags */}}
{{ range findRE `<img\s+[^>]*>` $content -}}
  {{ $imgTag := . -}}
  {{/* extract src attribute */}}
  {{ with findRESubmatch `src=['"]([^'"]+)['"]` $imgTag -}}
    {{ $srcAttr := index (index . 0) 0 -}}
    {{ $srcValue := index (index . 0) 1 -}}
    {{ $srcValueFinal := $srcValue -}}

    {{ if or (hasPrefix $srcValue "http://") (hasPrefix $srcValue "https://") -}}
      {{ with resources.GetRemote $srcValue -}}{{ $srcValueFinal = .RelPermalink -}}{{ end -}}
    {{ else -}}
      {{ with $.Page.Resources.GetMatch $srcValue -}}
        {{ $srcValueFinal = .RelPermalink -}}
      {{ else -}}
        {{ with resources.GetMatch $srcValue -}}{{ $srcValueFinal = .RelPermalink -}}{{ end -}}
      {{ end -}}
    {{ end -}}

    {{ $newTag := replace $imgTag $srcAttr (printf `src="%s"` $srcValueFinal) -}}
    {{ $content = replace $content $imgTag $newTag -}}
  {{ end -}}
{{ end -}}

{{/* images without alternative text get an explicit empty alt so screen
  readers skip them instead of announcing the file name */}}
{{ range findRE `<img\s+[^>]*>` $content -}}
  {{ $imgTag := . -}}
  {{ if not (findRE `\salt=` $imgTag) -}}
    {{ $newTag := replaceRE `^<img\s` `<img alt="" ` $imgTag -}}
    {{ $content = replace $content $imgTag $newTag -}}
  {{ end -}}
{{ end -}}

{{ if not .Parent }}<div class="width-patch"></div>{{ end }}
<div id="{{- $id -}}" class="gallery lightbox-gallery"
  data-label="{{ i18n "photo_lightbox" }}"
  data-previous="{{ i18n "photo_previous" }}"
  data-next="{{ i18n "photo_next" }}"
  data-close="{{ i18n "photo_close" }}">
  {{ $content | safeHTML -}}
</div>
