name: Generate feature image

on:
  workflow_dispatch:
    inputs:
      post:
        description: "Post path, e.g. content/post/my-post/index.md"
        required: false
        type: string
      payload:
        description: "Pages CMS action payload as JSON"
        required: false
        type: string
      style:
        description: "Image style"
        required: false
        type: choice
        default: "Photographic editorial image"
        options:
          - "Photographic editorial image"
          - "Analog film photography"
          - "Architectural photography"
          - "Macro photography"
          - "Printmaking / linocut"
          - "Editorial illustration"
      extra_prompt:
        description: "Optional artistic direction"
        required: false
        default: ""
        type: string
      force:
        description: "Replace an existing non-default feature image"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install openai pillow pyyaml

      - name: Generate image and update metadata
        id: image
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POST: ${{ inputs.post }}
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
          IMAGE_STYLE: ${{ inputs.style }}
          EXTRA_PROMPT: ${{ inputs.extra_prompt }}
          FORCE: ${{ inputs.force }}
        run: |
          if [[ -n "$PAGES_CMS_PAYLOAD" ]]; then
            POST=$(jq -er --arg ref "$GITHUB_REF_NAME" '
              select(.source == "pages-cms" and .action.name == "generate-image"
                and .repository.ref == $ref and .context.type == "entry"
                and (.context.name == "posts" or .context.name == "legacy" or .context.name == "legacy-html" or .context.name == "org-posts")) | .context.path
            ' <<< "$PAGES_CMS_PAYLOAD")
            IMAGE_STYLE=$(jq -r '.inputs.style // "Photographic editorial image"' <<< "$PAGES_CMS_PAYLOAD")
            EXTRA_PROMPT=$(jq -r '.inputs.extra_prompt // ""' <<< "$PAGES_CMS_PAYLOAD")
            FORCE=$(jq -r '.inputs.force // false | tostring' <<< "$PAGES_CMS_PAYLOAD")
            if [[ ! "$POST" =~ ^(content-pagescms/[^/]+\.md|content-legacy/[^/]+\.(md|html)|content/post/[^/]+/index\.md|content/post/[^/]+\.md)$ ]]; then
              echo "Unexpected Pages CMS post path: $POST" >&2
              exit 1
            fi
          fi
          if [[ -z "$POST" || ! -f "$POST" ]]; then
            echo "Select a saved post before generating an image: $POST" >&2
            exit 1
          fi
          args=(generate "$POST" --style "${IMAGE_STYLE:-Photographic editorial image}")
          if [[ -n "$EXTRA_PROMPT" ]]; then
            args+=(--extra-prompt "$EXTRA_PROMPT")
          fi
          if [[ "$FORCE" == "true" ]]; then
            args+=(--force)
          fi
          python scripts/generate-feature-image.py "${args[@]}"

      - name: Create feature-image branch
        id: branch
        env:
          SLUG: ${{ steps.image.outputs.slug }}
        run: |
          branch="ai-feature-image/${SLUG}-${GITHUB_RUN_ID}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"

      - name: Commit generated feature image
        env:
          TITLE: ${{ steps.image.outputs.title }}
        run: |
          if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "No changes generated"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ content-pagescms/ content-legacy/ content-org/ assets/img/generated/ 2>/dev/null || true
          git commit -m "auto: feature-image: $TITLE"
          git push --set-upstream origin "${{ steps.branch.outputs.name }}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.image.outputs.title }}
          IMAGE: ${{ steps.image.outputs.image }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE: ${{ github.ref_name }}
        run: |
          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "AI feature image: $TITLE" \
            --body "$(cat <<EOF
          Generates a proposed AI feature image for **$TITLE**.

          Image: `$IMAGE`

          This PR is intentionally reviewable rather than auto-merged so the image can be checked in the Netlify deploy preview before accepting it.
          EOF
          )"
